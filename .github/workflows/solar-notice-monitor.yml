name: Solar Notice Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate monitoring heartbeat
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          p = Path('monitor-status.json')
          now = datetime.now(timezone.utc).isoformat()
          p.write_text('{"status":"scheduled","last_run":"'+now+'","collector":"placeholder"}\n', encoding='utf-8')
          PY

      - name: Commit monitoring status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore: update solar monitor heartbeat'
          git push
