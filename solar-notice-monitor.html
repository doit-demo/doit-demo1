<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSOLAR 공고 모니터</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f5f7fb;color:#182230;margin:0}.c{max-width:1180px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;flex-wrap:wrap}.ey{color:#146c43;font-size:12px;font-weight:800;letter-spacing:.08em}.t{font-size:32px;font-weight:850;margin:5px 0}.sub,.muted{color:#6b7280}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.btn,input,select{border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:10px 12px;font:inherit}button,.btn{cursor:pointer;font-weight:750}.primary{background:#146c43;color:#fff;border-color:#146c43}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 4px 18px rgba(20,40,30,.04)}.stat{padding:16px}.stat b{display:block;font-size:26px;margin-top:5px}.controls{padding:15px}.row{display:flex;gap:8px;flex-wrap:wrap}.row+.row{margin-top:10px}input{flex:1;min-width:240px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip.active{background:#eaf7ef;border-color:#a7d9bd;color:#0f5b38}.status{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f0f8f3;border:1px solid #d7ebdf;font-size:12px}.err{background:#fff3f1;border-color:#f2ccc5}.list{display:grid;gap:12px;margin-top:15px}.notice{padding:18px}.head{display:flex;justify-content:space-between;gap:15px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}.badge{font-size:11px;padding:5px 8px;border-radius:99px;background:#eef2f4}.badge.kw{background:#e7f6ec;color:#12633d;font-weight:800}.badge.cat{background:#eef0ff;color:#3d4ea0;font-weight:800}.badge.hot{background:#fff1dc;color:#9a5a00;font-weight:800}.notice h3{margin:0;font-size:18px}.notice p{line-height:1.55;color:#4b5563}.meta{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:#6b7280}.score{font-size:28px;font-weight:900;color:#146c43}.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:13px}.empty{text-align:center;padding:40px;color:#6b7280}.sourcegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.source{padding:12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;font-size:12px}.ok{color:#146c43}.bad{color:#b42318}.warn{color:#9a5a00}.hint{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f8fafc;font-size:12px;color:#475569}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}.t{font-size:25px}.head{flex-direction:column}.sourcegrid{grid-template-columns:1fr}input{min-width:0}}
</style>
</head>
<body><div class="c">
<div class="top"><div><div class="ey">DSOLAR · OPPORTUNITY RADAR</div><div class="t">태양광 공고 모니터</div><div class="sub">실제 자동수집 데이터 · 매시간 GitHub Actions</div><div id="status" class="status">상태 확인 중...</div></div><div class="actions"><button onclick="load()">↻ 데이터 재조회</button><button class="primary" onclick="window.open('https://github.com/doit-demo/doit-demo1/actions','_blank')">수집 작업</button></div></div>
<div class="stats"><div class="card stat"><span class="muted">저장 공고</span><b id="total">-</b><small class="muted">누적</small></div><div class="card stat"><span class="muted">고관련도</span><b id="high">-</b><small class="muted">90점 이상</small></div><div class="card stat"><span class="muted">최근 24시간</span><b id="recent">-</b><small class="muted">신규 수집</small></div><div class="card stat"><span class="muted">영업우선</span><b id="priority">-</b><small class="muted">관련도 90+ + 사업형</small></div><div class="card stat"><span class="muted">마지막 실행</span><b id="last" style="font-size:18px">-</b><small class="muted">Actions 기준</small></div></div>
<div class="card controls"><div class="row"><input id="q" placeholder="공고명·기관·키워드 검색" oninput="render()"><select id="sort" onchange="render()"><option value="new">최신순</option><option value="score">관련도순</option></select><select id="cat" onchange="render()"><option value="전체">전체 사업유형</option><option>발전사업</option><option>영농형/농촌</option><option>공공부지</option><option>지붕형</option><option>주민참여</option><option>수상태양광</option><option>신재생 일반</option></select></div><div class="row"><div class="chips" id="chips"></div></div></div>
<div id="list" class="list"></div><div class="card sourcegrid" id="sources"></div>
<div class="hint">현재는 공개 RSS + 기업마당 API adapter가 연결되어 있습니다. 기업마당은 <b>BIZINFO_API_KEY</b> GitHub Secret이 있어야 활성화됩니다. 다음 단계에서 나라장터·에너지공단·경남/거제시 공식 공고 adapter를 추가할 수 있습니다.</div>
</div>
<script>
const D='./data/notices.json',S='./monitor-status.json';let data=[],active='전체';
async function load(){const st=document.getElementById('status');st.textContent='최신 수집 결과 확인 중...';try{const[a,b]=await Promise.all([fetch(D+'?t='+Date.now()),fetch(S+'?t='+Date.now())]);if(!a.ok)throw Error('데이터 파일 없음');data=await a.json();const s=b.ok?await b.json():{};const last=s.last_run?new Date(s.last_run).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';document.getElementById('last').textContent=last;document.getElementById('total').textContent=data.length;document.getElementById('high').textContent=data.filter(x=>(x.score||0)>=90).length;document.getElementById('recent').textContent=data.filter(x=>x.collected_at&&(Date.now()-new Date(x.collected_at).getTime())<86400000).length;document.getElementById('priority').textContent=data.filter(x=>(x.score||0)>=90&&x.category&&x.category!=='신재생 일반').length;st.textContent=`자동수집 ${s.status||'unknown'} · ${s.stored_total??data.length}건 · 소스 ${s.sources??'-'}개`;st.className='status';makeChips();makeSources(s);render()}catch(e){data=[];['total','high','recent','priority'].forEach(id=>document.getElementById(id).textContent='0');st.textContent='연결 실패: '+e.message;st.className='status err';render()}}
function makeChips(){const ks=[...new Set(data.flatMap(x=>x.matched_keywords||[]))].slice(0,16);document.getElementById('chips').innerHTML=['전체',...ks].map(k=>`<button class="chip ${k==='전체'?'active':''}" onclick="chip('${esc(k)}',this)">${esc(k)}</button>`).join('')}
function makeSources(s){const ss=s?.source_status||[];document.getElementById('sources').innerHTML=ss.length?ss.map(x=>`<div class="source"><b>${esc(x.name||'소스')}</b><br><span class="${x.status==='ok'?'ok':x.status==='disabled'?'warn':'bad'}">${esc(x.status||'unknown')}</span> · ${x.items||0}건${x.reason?'<br><span class="muted">'+esc(x.reason)+'</span>':''}</div>`).join(''):'<div class="source">수집원 상태 데이터 없음</div>'}
function chip(k,e){active=k;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));e.classList.add('active');render()}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),cat=document.getElementById('cat').value;let r=data.filter(x=>{const txt=[x.title,x.description,x.source,x.organization,x.category,...(x.matched_keywords||[])].join(' ').toLowerCase();return(!q||txt.includes(q))&&(active==='전체'||(x.matched_keywords||[]).includes(active))&&(cat==='전체'||x.category===cat)});if(document.getElementById('sort').value==='score')r.sort((a,b)=>(b.score||0)-(a.score||0));else r.sort((a,b)=>String(b.published||b.collected_at||'').localeCompare(String(a.published||a.collected_at||'')));document.getElementById('list').innerHTML=r.length?r.map(x=>{const hot=(x.score||0)>=90,cat=x.category||'미분류';return `<article class="card notice"><div class="head"><div><div class="badges"><span class="badge">${esc(x.source||'공공공고')}</span><span class="badge cat">${esc(cat)}</span>${hot?'<span class="badge hot">영업우선</span>':''}${(x.matched_keywords||[]).slice(0,4).map(k=>`<span class="badge kw">${esc(k)}</span>`).join('')}</div><h3>${esc(x.title||'제목 없음')}</h3><p>태양광 사업 관련도 <b>${x.score||0}</b>점</p><div class="meta"><span>기관 ${esc(x.organization||'-')}</span><span>발행 ${esc(x.published||'-')}</span><span>수집 ${fmt(x.collected_at)}</span></div></div><div class="score">${x.score||0}</div></div><div class="foot"><span class="muted" style="font-size:12px">매칭: ${(x.matched_keywords||[]).join(', ')||'-'}</span><a class="btn" href="${attr(x.url||'#')}" target="_blank" rel="noopener">원문 확인 →</a></div></article>`}).join(''):'<div class="card empty">현재 조건에 맞는 실제 수집 공고가 없습니다.</div>'}
function fmt(v){if(!v)return'-';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s).replace(/`/g,'&#96;')}load();
</script></body></html>
